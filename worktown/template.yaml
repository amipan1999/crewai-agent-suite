AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AI WORK TOWN - AIエージェントの職業体験パーク＋AIコンサル受付サイト
  (S3 + CloudFront / Lambda Function URL -> Amazon Bedrock / DynamoDB / SNS)

Parameters:
  ModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Bedrock のモデルID（Messages API / bedrock-mantle 経由）
  ModelEffort:
    Type: String
    Default: low
    AllowedValues: [low, medium, high, xhigh, max]
    Description: 推論の深さ。デモの応答速度とコストを優先して low を既定に
  BedrockRegion:
    Type: String
    Default: ""
    Description: Bedrock を呼び出すリージョン（空ならスタックと同じ）
  DailyLimitPerIp:
    Type: Number
    Default: 15
  DailyLimitGlobal:
    Type: Number
    Default: 1000
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: CloudFront→Lambda 間の検証ヘッダー値（deploy.sh が自動生成）
  NotifyEmail:
    Type: String
    Default: ""
    Description: お問い合わせ通知を受け取るメールアドレス（任意）

Conditions:
  HasNotifyEmail: !Not [!Equals [!Ref NotifyEmail, ""]]
  HasBedrockRegion: !Not [!Equals [!Ref BedrockRegion, ""]]

Resources:
  # ---------- データ ----------
  TownTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  LeadsTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotifyEmail
    Properties:
      Subscription:
        - { Protocol: email, Endpoint: !Ref NotifyEmail }

  # ---------- API ----------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 120
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          MODEL_EFFORT: !Ref ModelEffort
          BEDROCK_REGION: !If [HasBedrockRegion, !Ref BedrockRegion, !Ref AWS::Region]
          TABLE_NAME: !Ref TownTable
          DAILY_LIMIT_PER_IP: !Ref DailyLimitPerIp
          DAILY_LIMIT_GLOBAL: !Ref DailyLimitGlobal
          ORIGIN_VERIFY: !Ref OriginVerifySecret
          LEADS_TOPIC_ARN: !If [HasNotifyEmail, !Ref LeadsTopic, ""]
      FunctionUrlConfig:
        AuthType: NONE # CloudFront 経由のみ受け付ける（ORIGIN_VERIFY ヘッダーで検証）
        InvokeMode: RESPONSE_STREAM # AIの生成過程をそのまま画面に流す
      Policies:
        - arn:aws:iam::aws:policy/AmazonBedrockMantleInferenceAccess
        - DynamoDBCrudPolicy: { TableName: !Ref TownTable }
        - !If
          - HasNotifyEmail
          - SNSPublishMessagePolicy: { TopicName: !GetAtt LeadsTopic.TopicName }
          - !Ref AWS::NoValue

  # Function URL 経由の呼び出しには InvokeFunctionUrl に加えて InvokeFunction の許可も必要
  ApiFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- 静的サイト ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security"
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AI WORK TOWN
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            # Function URL (https://xxxx.lambda-url.region.on.aws/) からホスト名だけを取り出す
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginCustomHeaders:
              - { HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerifySecret }
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders

Outputs:
  SiteUrl:
    Description: 公開URL
    Value: !Sub "https://${Distribution.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  LeadsTable:
    Description: お問い合わせ（pk が lead# で始まる項目）
    Value: !Ref TownTable
